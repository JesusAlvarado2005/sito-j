# Build + test a ogni push e pull request.
# Su main, se i test passano, pubblica le immagini Docker su GHCR (amd64 + arm64) per la VM Oracle.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # serve solo per pubblicare su GHCR
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers usa il Docker già presente sul runner
      - name: Build e test
        run: ./mvnw -B verify

      - name: Login a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # Il Dockerfile copia solo il jar (nessun RUN), quindi l'immagine arm64 si crea senza emulazione
      - name: Pubblica le immagini
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for module in profile-service projects-service contact-service web-public; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              --build-arg MODULE=$module \
              -t ghcr.io/jesusalvarado2005/sito-j-$module:latest \
              -t ghcr.io/jesusalvarado2005/sito-j-$module:${{ github.sha }} \
              --push .
          done
