spring:
  application:
    name: contact-service

  datasource:
    # Valori di default per lo sviluppo locale; in Docker/produzione arrivano dalle variabili d'ambiente
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sitoj}
    username: ${CONTACT_DB_USER:contact_svc}
    password: ${CONTACT_DB_PASSWORD:change-me-contact}

  jpa:
    # Lo schema lo crea SOLO Flyway: Hibernate verifica che le entity corrispondano alle tabelle
    hibernate:
      ddl-auto: validate
    # Niente query lazy durante il rendering: le transazioni finiscono nel service
    open-in-view: false
    properties:
      hibernate:
        default_schema: contact

  flyway:
    schemas: contact
    default-schema: contact

  mvc:
    # Gli errori vengono restituiti come ProblemDetail (RFC 9457)
    problemdetails:
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Senza timeout JavaMail aspetta all'infinito: un SMTP bloccato fermerebbe il job
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Timeout per tutte le chiamate RestClient (Turnstile)
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never

management:
  health:
    # Le email partono in modo asincrono (outbox con tentativi): se Gmail è giù il form funziona lo stesso,
    # quindi l'SMTP non deve rendere "DOWN" il servizio (Docker lo considererebbe guasto)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

contact:
  # Secret Cloudflare Turnstile. Vuoto = ogni verifica fallisce (fail-closed).
  # Per lo sviluppo: 1x0000000000000000000000000000000AA (chiave di test che accetta sempre)
  turnstile:
    secret: ${TURNSTILE_SECRET:}
    url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  # Chiave HMAC per l'hash degli IP. OBBLIGATORIA: senza, il servizio non parte.
  ip-salt: ${CONTACT_IP_SALT:}
  # Difesa in profondità: il rate limit principale sarà nel gateway
  rate-limit:
    per-ip: 5
    global: 50
    window: PT1H
  # GDPR: i messaggi più vecchi di così vengono cancellati (job notturno)
  retention: P365D
  # Job pianificati (notifiche + pulizia). Nei test sono disattivati.
  jobs:
    enabled: true
  notification:
    interval: PT1M
    max-attempts: 12      # con il backoff esponenziale copre circa 20 ore
    to: ${CONTACT_NOTIFY_TO:}
    from: ${MAIL_USERNAME:}
