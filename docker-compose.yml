# Ambiente locale. Avvio:  docker compose up -d
# Per ora c'è solo PostgreSQL; i microservizi verranno aggiunti man mano.
name: sito-j

services:
  postgres:
    image: postgres:18-alpine
    container_name: sitoj-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # solo localhost: il DB non è mai raggiungibile da fuori
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # script eseguiti SOLO al primo avvio (volume vuoto): creano schemi e utenti
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
