spring:
  application:
    name: web-public

  messages:
    basename: messages
    # Se manca una chiave nella lingua richiesta si usa messages.properties, non la lingua del sistema
    fallback-to-system-locale: false

  thymeleaf:
    # In sviluppo i template si rileggono a ogni richiesta; in produzione restano in cache
    cache: ${THYMELEAF_CACHE:true}

  # Timeout per tutte le chiamate verso i microservizi
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${SERVER_PORT:8080}
  # IP reale del visitatore: Tomcat legge X-Forwarded-For SOLO se la richiesta arriva da un proxy interno
  # (reti private e localhost: Caddy/gateway nella rete Docker). Un X-Forwarded-For inviato da fuori non conta.
  forward-headers-strategy: native
  tomcat:
    # Redirect relativi ("Location: /it"): dietro un proxy Tomcat non conosce porta e dominio pubblici,
    # e un redirect assoluto ricostruito da lui potrebbe puntare all'indirizzo sbagliato
    use-relative-redirects: true
    # Il form pesa pochi KB: oltre i 64 KB la richiesta non viene nemmeno letta
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
  error:
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

site:
  # URL pubblico (canonical, hreflang, sitemap). In produzione: SITE_BASE_URL=https://il-tuo-dominio
  base-url: ${SITE_BASE_URL:http://localhost:8080}
  profile-service-url: ${PROFILE_SERVICE_URL:http://localhost:8081}
  projects-service-url: ${PROJECTS_SERVICE_URL:http://localhost:8082}
  cache-ttl: PT5M
  contact:
    service-url: ${CONTACT_SERVICE_URL:http://localhost:8083}
    # Site key pubblica di Cloudflare Turnstile. In sviluppo: 1x00000000000000000000AA (chiave di test)
    turnstile-site-key: ${TURNSTILE_SITE_KEY:}
    per-ip: 5
    global: 50
    window: PT1H
