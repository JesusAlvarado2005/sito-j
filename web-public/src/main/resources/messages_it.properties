privacy.kicker=Privacy
privacy.title=Come tratto i tuoi dati
privacy.back=Torna al sito
privacy.intro=Questo sito raccoglie dati personali solo quando mi scrivi dal form contatti. Ecco quali, perché e per quanto tempo.
privacy.s1.title=Chi tratta i dati
privacy.s1.text=Jeanfranco Alvarado, persona fisica. Per qualsiasi domanda: <a href="mailto:{0}">{0}</a>.
privacy.s2.title=Cosa raccolgo
privacy.s2.text=Nome, email, oggetto e testo del messaggio. Dell''indirizzo IP non salvo il valore, ma solo un''impronta cifrata con una chiave segreta (HMAC): serve a limitare lo spam e non permette di risalire all''IP.
privacy.s3.title=Perché e per quanto
privacy.s3.text=Solo per leggere il tuo messaggio e risponderti. Non uso i dati per altro e non li cedo a nessuno. I messaggi vengono cancellati in automatico dopo 12 mesi.
privacy.s4.title=Servizi esterni
privacy.s4.text=Il form usa <a href="https://www.cloudflare.com/privacypolicy/" rel="noopener">Cloudflare Turnstile</a> per verificare che a scrivere sia una persona: lo script si carica solo quando arrivi al form e riceve dati tecnici del browser, compreso l''IP. L''avviso di un nuovo messaggio mi arriva per email tramite Gmail (Google).
privacy.s5.title=Cookie
privacy.s5.text=Il sito non usa cookie di profilazione né strumenti di statistica. Nel tuo browser salva solo la scelta del tema chiaro o scuro.
privacy.s6.title=I tuoi diritti
privacy.s6.text=Puoi chiedermi di vedere, correggere o cancellare i tuoi dati scrivendo a <a href="mailto:{0}">{0}</a>. Puoi anche presentare un reclamo al <a href="https://www.garanteprivacy.it" rel="noopener">Garante per la protezione dei dati personali</a>.
privacy.updated=Ultimo aggiornamento: novembre 2026.

