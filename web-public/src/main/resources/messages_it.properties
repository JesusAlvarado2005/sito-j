privacy.static.s3.title=Dove è ospitato
privacy.static.s3.text=Il sito è ospitato su <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" rel="noopener">GitHub Pages</a>. Come ogni server, GitHub registra dati tecnici delle visite, come l''indirizzo IP, per motivi di sicurezza: io non ho accesso a questi dati.
