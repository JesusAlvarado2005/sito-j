privacy.static.s3.text=The site is hosted on <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" rel="noopener">GitHub Pages</a>. Like any server, GitHub logs technical visit data, such as the IP address, for security reasons: I have no access to this data.
