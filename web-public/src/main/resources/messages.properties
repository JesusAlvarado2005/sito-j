privacy.kicker=Privacy
privacy.title=How I handle your data
privacy.back=Back to the site
privacy.intro=This site collects personal data only when you write to me through the contact form. Here is what, why and for how long.
privacy.s1.title=Who handles the data
privacy.s1.text=Jeanfranco Alvarado, as a private individual. For any question: <a href="mailto:{0}">{0}</a>.
privacy.s2.title=What I collect
privacy.s2.text=Name, email, subject and text of the message. I do not store your IP address, only a fingerprint encrypted with a secret key (HMAC): it helps limit spam and cannot be turned back into the IP.
privacy.s3.title=Why and for how long
privacy.s3.text=Only to read your message and reply. I do not use the data for anything else and I do not share it with anyone. Messages are deleted automatically after 12 months.
privacy.s4.title=Third-party services
privacy.s4.text=The form uses <a href="https://www.cloudflare.com/privacypolicy/" rel="noopener">Cloudflare Turnstile</a> to check that a person is writing: the script loads only when you reach the form and receives technical browser data, including the IP. I get notified of new messages by email through Gmail (Google).
privacy.s5.title=Cookies
privacy.s5.text=The site uses no profiling cookies and no analytics. It only stores your light or dark theme choice in your browser.
privacy.s6.title=Your rights
privacy.s6.text=You can ask me to see, correct or delete your data by writing to <a href="mailto:{0}">{0}</a>. You can also lodge a complaint with the Italian <a href="https://www.garanteprivacy.it" rel="noopener">data protection authority (Garante)</a>.
privacy.updated=Last updated: November 2026.

