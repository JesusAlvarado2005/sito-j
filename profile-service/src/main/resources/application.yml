spring:
  application:
    name: profile-service

  datasource:
    # Valori di default per lo sviluppo locale; in Docker/produzione arrivano dalle variabili d'ambiente
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sitoj}
    username: ${PROFILE_DB_USER:profile_svc}
    password: ${PROFILE_DB_PASSWORD:change-me-profile}

  jpa:
    # Lo schema lo crea SOLO Flyway: Hibernate verifica che le entity corrispondano alle tabelle
    hibernate:
      ddl-auto: validate
    # Niente query lazy durante il rendering: le transazioni finiscono nel service
    open-in-view: false
    properties:
      hibernate:
        default_schema: profile

  flyway:
    # db/seed = i miei dati reali (vuoto nei test). Versioni nella stessa sequenza delle migrazioni.
    locations: classpath:db/migration,classpath:db/seed
    schemas: profile
    default-schema: profile

  mvc:
    # Gli errori vengono restituiti come ProblemDetail (RFC 9457)
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
